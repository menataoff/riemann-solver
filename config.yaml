# §1.1: задача Римана для двух постоянных состояний.
gas:
  gamma: 1.4

method:
  solver: exact
  scheme: none

domain:
  x_min: 0.0
  x_max: 1.0
  discontinuity: 0.5

initial:
  left:
    rho: 1.0
    u: 0.0
    p: 1.0
  right:
    rho: 0.125
    u: 0.0
    p: 0.1

# Граничные условия хранятся для будущей схемы на сетке.
# Точный решатель задачи Римана их не использует.
boundary:
  left:
    type: transmissive
  right:
    type: transmissive

output:
  destination: console
  file: output/run.log
  sample_x: 0.5
  sample_time: 0.25
